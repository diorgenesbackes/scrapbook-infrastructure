name: scrapbook-local
services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: scrapbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCRAPBOOK_DB_ADMIN_PASSWORD:?Defina SCRAPBOOK_DB_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${SCRAPBOOK_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "scrapbook", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  service:
    build:
      context: ../scrapbook-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ScrapBook: "Host=postgres;Port=5432;Database=scrapbook;Username=scrapbook_app;Password=${SCRAPBOOK_DB_APP_PASSWORD:?Defina SCRAPBOOK_DB_APP_PASSWORD};Timeout=2;Command Timeout=2"
      DataProtection__KeyPath: /app/keys
      DevelopmentIdentity__Enabled: ${SCRAPBOOK_DEV_IDENTITY_ENABLED:-false}
      DevelopmentIdentity__AccountId: ${SCRAPBOOK_DEV_ACCOUNT_ID:-}
      DevelopmentIdentity__Token: ${SCRAPBOOK_DEV_IDENTITY_TOKEN:-}
    ports:
      - "127.0.0.1:${SCRAPBOOK_API_PORT:-5080}:8080"
    volumes:
      - api-keys:/app/keys
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3
          read -r response <&3
          [[ "$$response" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: ../scrapbook-ui
      args:
        VITE_ENABLE_LOCAL_DIAGNOSTICS: "true"
    ports:
      - "127.0.0.1:${SCRAPBOOK_UI_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ui-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  api-keys:
